name: Apple Silicon Vision Tests

on:
  push:
    paths:
      - '.github/workflows/macos-vision.yml'
      - 'Package.swift'
      - 'Scripts/ci-check.sh'
      - 'Scripts/smoke-cli.sh'
      - 'Sources/**'
      - 'Tests/**'
  pull_request:
    paths:
      - '.github/workflows/macos-vision.yml'
      - 'Package.swift'
      - 'Scripts/ci-check.sh'
      - 'Scripts/smoke-cli.sh'
      - 'Sources/**'
      - 'Tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vision:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Confirm Apple Silicon runner
        run: |
          test "$(uname -m)" = arm64
          swift --version
      - name: Test local Vision and the review workflow
        run: Scripts/ci-check.sh swift test
      - name: Exercise the CLI with on-device analysis
        run: |
          swift build --product visioncull
          Scripts/ci-check.sh Scripts/smoke-cli.sh "$(swift build --show-bin-path)/visioncull"

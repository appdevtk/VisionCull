name: macOS App and CLI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test Apple Silicon
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Confirm ARM64 toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
      - name: Test the review workflow and on-device Vision
        run: Scripts/ci-check.sh swift test
      - name: Build app bundle and CLI
        run: Scripts/ci-check.sh Scripts/build-macos.sh
      - name: Verify ARM64 artifacts
        run: |
          xcrun lipo dist/VisionCull.app/Contents/MacOS/VisionCull -verify_arch arm64
          xcrun lipo dist/visioncull -verify_arch arm64
      - name: Scan, preview and export with the packaged CLI
        run: Scripts/ci-check.sh Scripts/smoke-cli.sh "$PWD/dist/visioncull"
      - name: Package CLI
        run: ditto -c -k --keepParent dist/visioncull dist/visioncull-cli-macOS.zip
      - uses: actions/upload-artifact@v5
        with:
          name: VisionCull-macOS-arm64
          path: |
            dist/VisionCull-macOS.zip
            dist/visioncull-cli-macOS.zip
          if-no-files-found: error

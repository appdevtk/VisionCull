name: macOS App and CLI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and package universal binaries
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      VISIONCULL_CI_METADATA_ONLY: '1'
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          uname -m
      - name: Test portable workflow and ImageIO
        run: Scripts/ci-check.sh swift test --skip 'testAppleVisionRunsOnLocalFixture|testReferenceImageSearchUsesLocalVisionAndCache'
      - name: Build Apple Silicon and Intel app and CLI
        run: Scripts/ci-check.sh Scripts/build-macos.sh --universal
      - name: Scan, preview and export with the packaged CLI
        run: Scripts/ci-check.sh Scripts/smoke-cli.sh "$PWD/dist/visioncull"
      - name: Package CLI
        run: ditto -c -k --keepParent dist/visioncull dist/visioncull-cli-macOS.zip
      - uses: actions/upload-artifact@v5
        with:
          name: VisionCull-macOS-universal
          path: |
            dist/VisionCull-macOS.zip
            dist/visioncull-cli-macOS.zip
          if-no-files-found: error
